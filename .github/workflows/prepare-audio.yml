name: Prepare listening audio

on:
  workflow_dispatch:
  push:
    paths:
      - prepare-audio.py
      - speech-text.js
      - .github/workflows/prepare-audio.yml
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read

# Keep a successor pending while the active builder watches for new uploads.
# Never cancel a voice that is being generated.
concurrency:
  group: prepare-listening-audio
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'raomedon-art/QTCELL'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install onnxruntime==1.23.2 numpy==2.2.6 imageio-ffmpeg==0.6.0
      - name: Watch uploads and publish verified audio
        run: |
          export FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          python -u prepare-audio.py --watch --watch-seconds 18900
