name: Prepare listening audio

on:
  workflow_dispatch:
  push:
    paths:
      - prepare-audio.py
      - speech-text.js
      - .github/workflows/prepare-audio.yml
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: prepare-listening-audio
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'raomedon-art/QTCELL'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: python prepare-audio.py --plan

  prepare:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install onnxruntime==1.23.2 numpy==2.2.6 imageio-ffmpeg==0.6.0
      - name: Prepare continuous audio and publish to the existing private bucket
        env:
          RECORD_ID: ${{ matrix.id }}
          VOICE: ${{ matrix.voice }}
        run: |
          export FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -version
          python -u prepare-audio.py --id "$RECORD_ID" --voice "$VOICE"
